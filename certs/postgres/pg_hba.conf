# pg_hba.conf para el contenedor de PostgreSQL de DESARROLLO con TLS.
#
# Lo monta compose.override.yaml vía `-c hba_file=...`. La diferencia con el
# pg_hba por defecto de la imagen es que NO hay ninguna línea `host` de texto
# plano: toda conexión TCP tiene que ser `hostssl`, así que el servidor rechaza
# cualquier intento de conectarse sin cifrar.
#
# TYPE   DATABASE  USER  ADDRESS       METHOD

# Conexiones por socket Unix dentro del contenedor (healthcheck `pg_isready`,
# scripts de inicialización de la imagen, `psql` manual): sin cifrado porque no
# salen del contenedor.
local    all       all                 trust

# Conexiones TCP (la aplicación): obligatorio TLS.
hostssl  all       all   0.0.0.0/0     scram-sha-256
hostssl  all       all   ::/0          scram-sha-256
