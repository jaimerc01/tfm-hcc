# Bases de datos de usar y tirar para los tests de extremo a extremo.
# Puertos no estándar (5433 / 27018) para no chocar con Postgres/Mongo locales.
#
#   docker compose -f e2e/docker-compose.test.yml up -d
#   docker compose -f e2e/docker-compose.test.yml down -v
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hcc_e2e
      POSTGRES_USER: hcc
      POSTGRES_PASSWORD: hcc
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # datos solo en memoria: se pierden al parar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcc -d hcc_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 2s
      timeout: 3s
      retries: 30
