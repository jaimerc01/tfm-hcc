spring:
  application:
    name: Historia Clinica Comun
  datasource:
    url: jdbc:postgresql://localhost:5432/HCC_DEV
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      # Si usas Atlas o una conexión compartida desde la extensión, exporta aquí la URI completa.
      # La contraseña debe ir por variable de entorno para no dejar secretos en el repositorio.
      uri: ${MONGODB_URI:mongodb+srv://jaimerc01:${MONGODB_PASSWORD}@hcc.u68mkjv.mongodb.net/hcc_logs?appName=hcc&retryWrites=true&w=majority&authSource=admin}
      auto-index-creation: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      # Por defecto Spring Boot limita la subida a 1MB, muy por debajo del límite
      # real de la aplicación (app.uploads.max-size-bytes, 10MB por defecto). Sin
      # este ajuste, cualquier archivo de más de 1MB se rechaza antes de llegar
      # al controlador con un MaxUploadSizeExceededException.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081 # Puerto HTTPS (cuando SSL habilitado)
  # Puerto HTTP adicional para redirigir a HTTPS (configurado en HttpToHttpsRedirectConfig)
  http:
    port: 8080
  # Descomentar y ajustar estas propiedades en producción con un keystore válido
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore/keystore.p12
  #   key-store-password: ${SSL_KEY_STORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: tfm-hcc

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: 3600000 # 1 hour in milliseconds
  cors:
    # Orígenes permitidos por CORS, separados por comas. En producción, sustituir por
    # el origen real del frontend desplegado (vía la variable de entorno).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://localhost:8080}

tfm:
  hcc:
    encryption:
      key: ${TFM_HCC_ENCRYPTION_KEY} # Clave para cifrado de datos sensibles (NIF, teléfono)

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:8080} # Origen del SPA, usado para las redirecciones del login con Google

logging:
  level:
    root: INFO
    com.hcc.tfm_hcc: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.mongodb.driver: WARN

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    name: ${LOG_PATH:/var/log/tfm-hcc}/tfm-hcc.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

---
spring:
  config:
    activate:
      on-profile: oauth-google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com
