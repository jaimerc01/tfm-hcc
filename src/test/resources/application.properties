# Test properties to satisfy placeholders used by the application
# JwtServiceImpl decodifica el secreto con Base64.getDecoder(): tiene que ser Base64
# valido y, para HS256, decodificar a >= 256 bits. Esto es Base64 de una clave de 32 bytes.
JWT_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
TFM_HCC_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
# de.flapdoodle.embed.mongo.spring3x arranca un mongod embebido y sobreescribe host/puerto
# automaticamente; solo necesita una URI sintacticamente valida (no se usa el host real)
spring.data.mongodb.uri=mongodb://localhost/hcc_logs_test
de.flapdoodle.mongodb.embedded.version=7.0.14
# Use an embedded H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
